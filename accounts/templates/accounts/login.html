{% extends 'accounts/base.html' %}

{% block title %}Log In - InstaClone{% endblock %}

{% block content %}
    <div class="'auth-box">
        <h2>Login</h2>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn-primary">Login</button>
        </form>

        <p class="auth-switch">
            Don't have an account? <a href="{% url 'signup' %}">Sign up</a>
        </p>

    </div>

{% endblock %}
